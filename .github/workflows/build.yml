name: build

# GitLab CI(.gitlab-ci.yml)의 build / test 스테이지를 옮긴 것이다.
# 고객 배포용이던 S3 관련 job(build_from_aws, build-publish,
# build-autotune-publish, publish)과 보드 job(test-board), openedge 는 옮기지 않았다.
# 보드 테스트는 SOTA-PNU/nestc-zcu102 에서 한다.
#
# 모든 job 은 이 저장소 전용 self-hosted 러너(compute-nestc)에서
# ETRI 공식 SDK 이미지(onesai1/nest-compiler-sdk) 안에서 돈다.
# GitHub 호스티드 러너는 쓰지 않는다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_all:
        description: "test-all (전체 빌드 + ninja check) 도 실행"
        type: boolean
        default: false

# self-hosted 러너 보호: 잡에 주는 토큰은 읽기 전용으로 좁힌다.
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 의미가 없다. main 은 끝까지 돌린다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  BUILD: build_ci

jobs:
  build:
    # public 레포 + self-hosted 러너: 포크에서 온 PR 은 이 머신에서 실행하지 않는다.
    # 본 레포 브랜치에서 연 PR(조직 멤버)은 정상 실행된다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, X64, nestc]
    container:
      image: onesai1/nest-compiler-sdk:1.0.0
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        include:
          # GitLab: build
          - name: release
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON
            lists: nestc_tests/nestc_vta_bundle_tests.txt nestc_tests/nestc_build_tests.txt
            targets: tvm check_nestc
          # GitLab: build-debug
          - name: debug
            cmake: -DCMAKE_BUILD_TYPE=Debug -DGLOW_WITH_BUNDLES=ON -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_VTA_INTERPRETER_FUSION=ON -DGLOW_VTA_FUSION=ON
            lists: nestc_tests/nestc_build_tests.txt
            targets: tvm check_nestc
          # GitLab: build-multievta
          - name: multievta
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON -DNESTC_EVTA_MULTI=ON
            targets: check_multievta
          # GitLab: build-vtaconv
          - name: vtaconv
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON -DNESTC_EVTA_GRAPH_OPT=ON
            lists: nestc_tests/nestc_vta_bundle_tests.txt nestc_tests/nestc_build_tests.txt
            targets: check_nestc
          # GitLab: build_bnn
          - name: bnn
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_BNN=ON
            targets: check_nestc
          # GitLab: build-without-VTA (allow_failure)
          - name: without-vta
            cmake: -DCMAKE_BUILD_TYPE=Release -DGLOW_WITH_BUNDLES=ON
            targets: all
            allow_failure: true
          # GitLab: build-all (allow_failure)
          - name: all
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON -DNESTC_WITH_EVTA=ON -DGLOW_WITH_STC=ON
            targets: all
            allow_failure: true

    continue-on-error: ${{ matrix.allow_failure || false }}

    steps:
      # 이전 job 의 '정리' 단계가 작업 디렉터리 소유권을 러너 계정에 돌려주므로,
      # root 로 도는 컨테이너의 git 은 이를 남의 저장소로 보고 거부한다(dubious ownership).
      # checkout 액션은 최상위 디렉터리만 예외로 등록하고 submodule 은 빠뜨린다.
      # 컨테이너는 job 마다 새로 뜨므로 이 설정은 이 job 안에서만 유효하다.
      - name: git safe.directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 설정
        run: |
          set -eux
          mkdir -p "$BUILD" && cd "$BUILD"
          export TVM_HOME=$GITHUB_WORKSPACE/tvm
          export DMLC_CORE=$TVM_HOME/3rdparty/dmlc-core
          export TVM_BUILD_PATH=$GITHUB_WORKSPACE/$BUILD/tvm
          export TVM_LIBRARY_PATH=$TVM_BUILD_PATH
          # 이미지(1.0.0)에는 llvm-config 가 PATH 에 없다. nestc-zcu102 와 같이 경로를 명시한다.
          cmake -G Ninja .. ${{ matrix.cmake }} -DLLVM_DIR=/usr/lib/llvm-8/lib/cmake/llvm

      - name: 빌드 / 테스트
        run: |
          set -eux
          cd "$BUILD"
          export TVM_HOME=$GITHUB_WORKSPACE/tvm
          export DMLC_CORE=$TVM_HOME/3rdparty/dmlc-core
          export TVM_BUILD_PATH=$GITHUB_WORKSPACE/$BUILD/tvm
          export TVM_LIBRARY_PATH=$TVM_BUILD_PATH
          export PATH=$TVM_BUILD_PATH:$PATH
          # 컨테이너에 PYTHONPATH 가 없다. set -u 에 걸리지 않게 기본값을 준다.
          export PYTHONPATH=$TVM_HOME/python:${PYTHONPATH:-}
          # nestc_tests/*.txt 는 GitLab 때처럼 한 줄에 타겟 하나다.
          for list in ${{ matrix.lists }}; do
            xargs -a "../$list" -I {} ninja {}
          done
          for t in ${{ matrix.targets }}; do
            ninja "$t"
          done

      - name: 요약
        if: always()
        run: |
          {
            echo '### ${{ matrix.name }}'
            echo '```'
            tail -n 30 "$BUILD/Testing/Temporary/LastTest.log" 2>/dev/null || echo '(테스트 로그 없음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build_ci/Testing/Temporary/*.log
            build_ci/CMakeFiles/CMakeError.log
          retention-days: 14
          if-no-files-found: ignore

      # 빌드 디렉터리는 job 당 수십 GB 다. 매 실행 뒤 치우지 않으면 디스크가 찬다.
      # 컨테이너는 root 로 돌기 때문에 남은 파일 소유권을 러너 계정에 돌려준다.
      # 그러지 않으면 다음 실행의 checkout 이 기존 파일을 지우지 못해 실패한다.
      - name: 정리
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/$BUILD"
          chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  # GitLab: test-all (manual, allow_failure)
  test-all:
    if: github.event_name == 'workflow_dispatch' && inputs.test_all
    runs-on: [self-hosted, linux, X64, nestc]
    container:
      image: onesai1/nest-compiler-sdk:1.0.0
    timeout-minutes: 480
    continue-on-error: true

    steps:
      # 이전 job 의 '정리' 단계가 작업 디렉터리 소유권을 러너 계정에 돌려주므로,
      # root 로 도는 컨테이너의 git 은 이를 남의 저장소로 보고 거부한다(dubious ownership).
      # checkout 액션은 최상위 디렉터리만 예외로 등록하고 submodule 은 빠뜨린다.
      # 컨테이너는 job 마다 새로 뜨므로 이 설정은 이 job 안에서만 유효하다.
      - name: git safe.directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 설정 / 빌드 / 테스트
        run: |
          set -eux
          mkdir -p "$BUILD" && cd "$BUILD"
          export TVM_HOME=$GITHUB_WORKSPACE/tvm
          export DMLC_CORE=$TVM_HOME/3rdparty/dmlc-core
          export TVM_BUILD_PATH=$GITHUB_WORKSPACE/$BUILD/tvm
          export TVM_LIBRARY_PATH=$TVM_BUILD_PATH
          export PATH=$TVM_BUILD_PATH:$PATH
          export PYTHONPATH=$TVM_HOME/python:${PYTHONPATH:-}
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DGLOW_WITH_BUNDLES=ON -DGLOW_WITH_VTA=ON -DGLOW_WITH_STC=ON \
            -DLLVM_DIR=/usr/lib/llvm-8/lib/cmake/llvm
          ninja all
          ninja check

      - name: 정리
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/$BUILD"
          chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
