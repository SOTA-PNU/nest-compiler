name: build

# GitLab CI(.gitlab-ci.yml)의 build / test 스테이지를 옮긴 것이다.
# 고객 배포용이던 S3 관련 job(build_from_aws, build-publish,
# build-autotune-publish, publish)과 openedge 는 옮기지 않았다.
# 보드 job(test-board)은 보드가 있는 SOTA-PNU/nestc-zcu102 에 검증을 맡기고 그 판정을 받는다.
#
# 모든 job 은 이 저장소 전용 self-hosted 러너(compute-nestc)에서
# ETRI 공식 SDK 이미지(onesai1/nest-compiler-sdk) 안에서 돈다.
# GitHub 호스티드 러너는 쓰지 않는다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_all:
        description: "test-all (전체 빌드 + ninja check) 도 실행"
        type: boolean
        default: false

# self-hosted 러너 보호: 잡에 주는 토큰은 읽기 전용으로 좁힌다.
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 의미가 없다. main 은 끝까지 돌린다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  BUILD: build_ci

jobs:
  build:
    # public 레포 + self-hosted 러너: 포크에서 온 PR 은 이 머신에서 실행하지 않는다.
    # 본 레포 브랜치에서 연 PR(조직 멤버)은 정상 실행된다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, X64, nestc]
    container:
      image: onesai1/nest-compiler-sdk:1.0.0
    timeout-minutes: 480

    strategy:
      fail-fast: false
      matrix:
        include:
          # GitLab: build
          - name: release
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON
            lists: nestc_tests/nestc_vta_bundle_tests.txt nestc_tests/nestc_build_tests.txt
            targets: tvm check_nestc
          # GitLab: build-debug
          - name: debug
            cmake: -DCMAKE_BUILD_TYPE=Debug -DGLOW_WITH_BUNDLES=ON -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_VTA_INTERPRETER_FUSION=ON -DGLOW_VTA_FUSION=ON
            lists: nestc_tests/nestc_build_tests.txt
            targets: tvm check_nestc
          # GitLab: build-multievta
          - name: multievta
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON -DNESTC_EVTA_MULTI=ON
            targets: check_multievta
          # GitLab: build-vtaconv
          - name: vtaconv
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON -DNESTC_EVTA_GRAPH_OPT=ON
            lists: nestc_tests/nestc_vta_bundle_tests.txt nestc_tests/nestc_build_tests.txt
            targets: check_nestc
          # GitLab: build_bnn
          - name: bnn
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_WITH_EVTA=ON -DNESTC_BNN=ON
            targets: check_nestc
          # GitLab: build-without-VTA (allow_failure)
          - name: without-vta
            cmake: -DCMAKE_BUILD_TYPE=Release -DGLOW_WITH_BUNDLES=ON
            targets: all
            allow_failure: true
          # GitLab: build-all (allow_failure)
          - name: all
            cmake: -DCMAKE_BUILD_TYPE=Release -DNESTC_EVTA_BUNDLE_TEST=ON -DGLOW_WITH_BUNDLES=ON -DNESTC_WITH_EVTA=ON -DGLOW_WITH_STC=ON
            targets: all
            allow_failure: true

    continue-on-error: ${{ matrix.allow_failure || false }}

    steps:
      # 이전 job 의 '정리' 단계가 작업 디렉터리 소유권을 러너 계정에 돌려주므로,
      # root 로 도는 컨테이너의 git 은 이를 남의 저장소로 보고 거부한다(dubious ownership).
      # checkout 액션은 최상위 디렉터리만 예외로 등록하고 submodule 은 빠뜨린다.
      # 컨테이너는 job 마다 새로 뜨므로 이 설정은 이 job 안에서만 유효하다.
      - name: git safe.directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 공용 서버다. 부하가 낮아질 때까지 기다렸다가 빌드한다.
      - name: 서버 부하 대기
        env:
          MAX_LOAD: ${{ vars.NESTC_MAX_LOAD }}
          MIN_MEM_GB: ${{ vars.NESTC_MIN_MEM_GB }}
          MAX_WAIT_MIN: ${{ vars.NESTC_MAX_WAIT_MIN }}
        run: .github/scripts/wait-for-idle.sh

      - name: 설정
        run: |
          set -eux
          mkdir -p "$BUILD" && cd "$BUILD"
          export TVM_HOME=$GITHUB_WORKSPACE/tvm
          export DMLC_CORE=$TVM_HOME/3rdparty/dmlc-core
          export TVM_BUILD_PATH=$GITHUB_WORKSPACE/$BUILD/tvm
          export TVM_LIBRARY_PATH=$TVM_BUILD_PATH
          # 이미지(1.0.0)에는 llvm-config 가 PATH 에 없다. nestc-zcu102 와 같이 경로를 명시한다.
          cmake -G Ninja .. ${{ matrix.cmake }} -DLLVM_DIR=/usr/lib/llvm-8/lib/cmake/llvm

      - name: 빌드 / 테스트
        run: |
          set -eux
          cd "$BUILD"
          export TVM_HOME=$GITHUB_WORKSPACE/tvm
          export DMLC_CORE=$TVM_HOME/3rdparty/dmlc-core
          export TVM_BUILD_PATH=$GITHUB_WORKSPACE/$BUILD/tvm
          export TVM_LIBRARY_PATH=$TVM_BUILD_PATH
          export PATH=$TVM_BUILD_PATH:$PATH
          # 컨테이너에 PYTHONPATH 가 없다. set -u 에 걸리지 않게 기본값을 준다.
          export PYTHONPATH=$TVM_HOME/python:${PYTHONPATH:-}
          # nestc_tests/*.txt 는 GitLab 때처럼 한 줄에 타겟 하나다.
          for list in ${{ matrix.lists }}; do
            xargs -a "../$list" -I {} ninja {}
          done
          for t in ${{ matrix.targets }}; do
            ninja "$t"
          done

      - name: 요약
        if: always()
        run: |
          {
            echo '### ${{ matrix.name }}'
            echo '```'
            tail -n 30 "$BUILD/Testing/Temporary/LastTest.log" 2>/dev/null || echo '(테스트 로그 없음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build_ci/Testing/Temporary/*.log
            build_ci/CMakeFiles/CMakeError.log
          retention-days: 14
          if-no-files-found: ignore

      # 빌드 디렉터리는 job 당 수십 GB 다. 매 실행 뒤 치우지 않으면 디스크가 찬다.
      # 컨테이너는 root 로 돌기 때문에 남은 파일 소유권을 러너 계정에 돌려준다.
      # 그러지 않으면 다음 실행의 checkout 이 기존 파일을 지우지 못해 실패한다.
      - name: 정리
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/$BUILD"
          chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  # GitLab: test-board
  # build 가 통과한 커밋을 ZCU102 보드(VTA/EVTA)에서 실제로 돌린다. 보드 SSH 키,
  # 보드에 닿는 self-hosted 러너, 보드 작업 대기열은 SOTA-PNU/nestc-zcu102 에 있어서
  # 이 job 은 보드를 직접 건드리지 않는다. 그쪽 nest-compiler workflow 에 이 커밋을
  # 넘기고(repository_dispatch) 끝날 때까지 기다려 그 판정을 그대로 낸다. 보드 쪽에서:
  #   - 이 커밋으로 model-compiler 와 보드 런타임(vta/vtalib) 빌드
  #   - ResNet-18 / ResNet-50 단일 코어: cat_285 / dog_207 / zebra_340 정답 판정
  #   - ResNet-18 4코어 / ResNet-50 3코어 multi-EVTA: 정답 + 커널 oops 0건 + 처리량
  #   - 결과 표: https://github.com/SOTA-PNU/nestc-zcu102/blob/main/results/nest-compiler.md
  # 빌드를 하지 않고 요청·대기만 하므로 서버 부하 대기는 하지 않는다.
  #
  # 필요한 시크릿: BOARD_CI_TOKEN
  #   SOTA-PNU/nestc-zcu102 하나에만 접근하는 fine-grained 토큰.
  #   Contents: Read and write (repository_dispatch 요청), Actions: Read-only (실행 상태 조회).
  test-board:
    needs: build
    # public 레포 + self-hosted 러너: 포크에서 온 PR 은 이 머신에서 실행하지 않는다.
    # 본 레포 브랜치에서 연 PR(조직 멤버)은 정상 실행된다. (포크 PR 에는 시크릿도 없다.)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, X64, nestc]
    container:
      image: onesai1/nest-compiler-sdk:1.0.0
    # 보드 대기열(앞선 보드 작업) + 빌드 + 추론. 보통 20~40분.
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.BOARD_CI_TOKEN }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
      BOARD_REPO: SOTA-PNU/nestc-zcu102
      BOARD_WORKFLOW: nest-compiler.yml

    steps:
      - name: 보드 검증 요청
        run: |
          set -eu
          [ -n "$GH_TOKEN" ] || { echo "::error::시크릿 BOARD_CI_TOKEN 이 없다"; exit 1; }
          echo "START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # nestc-zcu102 쪽 실행 이름(run-name)이 "nest-compiler <커밋>[ (PR #n)]" 이다.
          # 다음 단계는 이 이름으로 자기가 요청한 실행을 찾는다.
          if [ -n "$PR" ]; then
            echo "TITLE=nest-compiler $SHA (PR #$PR)" >> "$GITHUB_ENV"
          else
            echo "TITLE=nest-compiler $SHA" >> "$GITHUB_ENV"
          fi
          # 이미지(1.0.0)에는 jq 가 없다. JSON 은 python3 로 만든다.
          payload=$(python3 -c 'import json, os
          p = {"ref": os.environ["SHA"]}
          if os.environ.get("PR"): p["pr"] = os.environ["PR"]
          print(json.dumps({"event_type": "nest-compiler", "client_payload": p}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$BOARD_REPO/dispatches" -d "$payload"
          echo "요청: $SHA"

      - name: 보드 결과 대기
        run: |
          set -eu
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          field() { python3 -c 'import json, sys; v = json.load(sys.stdin).get(sys.argv[1]); print("" if v is None else v)' "$1"; }
          # 실행이 만들어지기까지 최대 10분 기다린다. 이름이 같고 요청 뒤에 만들어진 것 중 마지막.
          RUN=
          for i in $(seq 1 40); do
            RUN=$(api "https://api.github.com/repos/$BOARD_REPO/actions/workflows/$BOARD_WORKFLOW/runs?event=repository_dispatch&per_page=30" |
              python3 -c 'import json, os, sys
          runs = [r for r in json.load(sys.stdin)["workflow_runs"]
                  if r["display_title"] == os.environ["TITLE"] and r["created_at"] >= os.environ["START"]]
          print(max(runs, key=lambda r: r["created_at"])["id"] if runs else "")')
            [ -n "$RUN" ] && break
            sleep 15
          done
          [ -n "$RUN" ] || { echo "::error::nestc-zcu102 쪽 실행을 찾지 못했다"; exit 1; }
          echo "RUN_URL=https://github.com/$BOARD_REPO/actions/runs/$RUN" >> "$GITHUB_ENV"
          echo "보드 실행: https://github.com/$BOARD_REPO/actions/runs/$RUN"
          # 앞선 보드 작업이 있으면 그 뒤에 줄을 선다(zcu102-board). 1분마다 상태를 본다.
          while :; do
            r=$(api "https://api.github.com/repos/$BOARD_REPO/actions/runs/$RUN")
            st=$(field status <<<"$r")
            [ "$st" = completed ] && break
            echo "[$(date -u +%H:%M:%S)] $st"
            sleep 60
          done
          CONCLUSION=$(field conclusion <<<"$r")
          echo "CONCLUSION=$CONCLUSION" >> "$GITHUB_ENV"
          echo "판정: $CONCLUSION"
          [ "$CONCLUSION" = success ]

      - name: 요약
        if: always()
        run: |
          {
            echo '### test-board (ZCU102)'
            echo "- 커밋: \`$SHA\`"
            echo "- 보드 실행: ${RUN_URL:-(찾지 못함)}"
            echo "- 판정: **${CONCLUSION:-(끝나지 않음)}**"
            echo "- 결과 표: https://github.com/$BOARD_REPO/blob/main/results/nest-compiler.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # GitLab: test-all (manual, allow_failure)
  test-all:
    if: github.event_name == 'workflow_dispatch' && inputs.test_all
    runs-on: [self-hosted, linux, X64, nestc]
    container:
      image: onesai1/nest-compiler-sdk:1.0.0
    timeout-minutes: 660
    continue-on-error: true

    steps:
      # 이전 job 의 '정리' 단계가 작업 디렉터리 소유권을 러너 계정에 돌려주므로,
      # root 로 도는 컨테이너의 git 은 이를 남의 저장소로 보고 거부한다(dubious ownership).
      # checkout 액션은 최상위 디렉터리만 예외로 등록하고 submodule 은 빠뜨린다.
      # 컨테이너는 job 마다 새로 뜨므로 이 설정은 이 job 안에서만 유효하다.
      - name: git safe.directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 공용 서버다. 부하가 낮아질 때까지 기다렸다가 빌드한다.
      - name: 서버 부하 대기
        env:
          MAX_LOAD: ${{ vars.NESTC_MAX_LOAD }}
          MIN_MEM_GB: ${{ vars.NESTC_MIN_MEM_GB }}
          MAX_WAIT_MIN: ${{ vars.NESTC_MAX_WAIT_MIN }}
        run: .github/scripts/wait-for-idle.sh

      - name: 설정 / 빌드 / 테스트
        run: |
          set -eux
          mkdir -p "$BUILD" && cd "$BUILD"
          export TVM_HOME=$GITHUB_WORKSPACE/tvm
          export DMLC_CORE=$TVM_HOME/3rdparty/dmlc-core
          export TVM_BUILD_PATH=$GITHUB_WORKSPACE/$BUILD/tvm
          export TVM_LIBRARY_PATH=$TVM_BUILD_PATH
          export PATH=$TVM_BUILD_PATH:$PATH
          export PYTHONPATH=$TVM_HOME/python:${PYTHONPATH:-}
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DGLOW_WITH_BUNDLES=ON -DGLOW_WITH_VTA=ON -DGLOW_WITH_STC=ON \
            -DLLVM_DIR=/usr/lib/llvm-8/lib/cmake/llvm
          ninja all
          ninja check

      - name: 정리
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/$BUILD"
          chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
